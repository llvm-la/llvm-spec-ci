# SPEC CPU 2006 Configuration: clang/flang on LoongArch
# Format for runspec v6612 (SPEC 2006)

strict_rundir_verify = 0

default= base:
   CC = @@BUILD_DIR@@/bin/clang
   CXX = @@BUILD_DIR@@/bin/clang++
   FC = @@BUILD_DIR@@/bin/flang
   CFLAGS = -O2 -march=loongarch64
   CXXFLAGS = -O2 -march=loongarch64 -std=c++98
   FFLAGS = -O2 -march=loongarch64
   LD = @@BUILD_DIR@@/bin/clang
   LDFLAGS = -Wl,--strip-all
   output_format = html
