# SPEC CPU 2006 Compiler Configuration for LLVM clang/flang on LoongArch
# Generated by llvm-spec-ci

define[LLVM_INSTALL] = @@BUILD_DIR@@/install

# C compiler
define[CC] = ${LLVM_INSTALL}/bin/clang
define[OPTIMIZATION_C] = -O2 -march=loongarch64
define[BASE_FLAGS_C] = ${OPTIMIZATION_C}
define[PEAK_FLAGS_C] = -O3 -march=loongarch64 -ffast-math

# C++ compiler
define[CXX] = ${LLVM_INSTALL}/bin/clang++
define[OPTIMIZATION_CXX] = -O2 -march=loongarch64 -std=c++98
define[BASE_FLAGS_CXX] = ${OPTIMIZATION_CXX}
define[PEAK_FLAGS_CXX] = -O3 -march=loongarch64 -std=c++98 -ffast-math

# Fortran compiler
define[FC] = ${LLVM_INSTALL}/bin/flang
define[OPTIMIZATION_F] = -O2 -march=loongarch64
define[BASE_FLAGS_F] = ${OPTIMIZATION_F}
define[PEAK_FLAGS_F] = -O3 -march=loongarch64 -ffast-math

# Linker flags
define[LD] = ${LLVM_INSTALL}/bin/clang
define[LD_F] = ${LLVM_INSTALL}/bin/flang
define[LINK_FLAGS] = -Wl,--strip-all
define[LINK_FLAGS_F] = -Wl,--strip-all

# Build settings
set[build:link line] = ${LINK_FLAGS}
set[build:link line f] = ${LINK_FLAGS_F}

# Output format
set[reportable_output_format] = html

# Run configuration
set[run:cmdline output limit] = 2000000
set[run:maxrunbytes] = 2000000