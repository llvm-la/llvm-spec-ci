# SPEC CPU 2006 Configuration: clang/flang on LoongArch
# 全局默认规则写在顶部，单个 benchmark 用 "name = base,peak: { ... }" 覆盖

define[LLVM_INSTALL] = @@BUILD_DIR@@

# 编译器
define[CC] = ${LLVM_INSTALL}/bin/clang
define[CXX] = ${LLVM_INSTALL}/bin/clang++
define[FC] = ${LLVM_INSTALL}/bin/flang

# 默认优化级别
define[OPT_CXX] = -O2 -march=loongarch64 -std=c++98
define[OPT_C] = -O2 -march=loongarch64
define[OPT_F] = -O2 -march=loongarch64

define[BASE_FLAGS_CXX] = ${OPT_CXX}
define[BASE_FLAGS_C] = ${OPT_C}
define[BASE_FLAGS_F] = ${OPT_F}

# 2006 区分 BASE 和 PEAK
define[PEAK_FLAGS_CXX] = -O3 -march=loongarch64 -std=c++98 -ffast-math
define[PEAK_FLAGS_C] = -O3 -march=loongarch64 -ffast-math
define[PEAK_FLAGS_F] = -O3 -march=loongarch64 -ffast-math

# 链接器
define[LD] = ${LLVM_INSTALL}/bin/clang
define[LD_F] = ${LLVM_INSTALL}/bin/flang
define[LINK_FLAGS] = -Wl,--strip-all
define[LINK_FLAGS_F] = -Wl,--strip-all

set[build:link line] = ${LINK_FLAGS}
set[build:link line f] = ${LINK_FLAGS_F}

set[reportable_output_format] = html
set[run:cmdline output limit] = 2000000
set[run:maxrunbytes] = 2000000

# ============================================================
# Per-benchmark overrides (SPEC 原生语法)
# 需要特殊编译参数的 benchmark 在下面添加覆盖块
# 格式: benchmark_name = base,peak: { 自定义参数 }
# ============================================================

# 示例: 403.gcc 需要特殊优化参数时取消注释并修改
# 403.gcc = base,peak: {
#   COPT = -O3 -march=loongarch64 -funroll-loops
#   PEAK_FLAGS_C = -O3 -march=loongarch64 -funroll-loops
# }
