#####################################################################
# SPEC CPU2006 config file for: clang / flang on Linux LoongArch
#####################################################################
#
# Usage: Copy to SPEC config directory, adjust paths as needed.
#
# Compiler issues: Contact your compiler vendor, not SPEC.
# For SPEC help:   http://www.spec.org/cpu2006/Docs/techsupport.html
#####################################################################

ignore_errors = yes
tune          = base
ext           = clang-loongarch
output_format = txt,html,csv
reportable    = 0
teeout        = yes
teerunout     = yes

hw_avail = # Nov-2099
sw_avail = # Nov-2099
license_num = nnn (Your SPEC license number)
company_name = Loongson
prepared_by = Loongson
tester_name = Loongson
test_date = # Nov-2099

makeflags = -j 8

default=default=default=default:
#####################################################################
#
# Compiler selection
#
#####################################################################
CC           = @@BUILD_DIR@@/bin/clang
CXX          = @@BUILD_DIR@@/bin/clang++
FC           = @@BUILD_DIR@@/bin/flang

## HW config
hw_cpu_name  = # Loongson XXX
hw_model     = # model
hw_cpu_mhz   = # frequency
hw_fpu       = Integrated
hw_nchips    = 1
hw_ncores    = #
hw_ncoresperchip= #
hw_nthreads  = #
hw_ncpuorder = 1
hw_parallel  = no
hw_pcache    = # 32KB I + 64KB D
hw_scache    = # 8192KB(I + D)
hw_tcache    = # None
hw_memory    = # 8GB DDR4

## SW config
sw_os        = # Linux Distribution
sw_file      = ext4
sw_state     = runlevel 3
sw_compiler  = clang & flang (LLVM main)

#####################################################################
# Optimization
#####################################################################

## Base
default=base=default=default:
COPTIMIZE    = -mabi=lp64d -O3 -mlsx
CXXOPTIMIZE  = -mabi=lp64d -O3 -mlsx
FOPTIMIZE    = -mabi=lp64d -O3 -mlsx

notes0100= C/C++ base flags: $[COPTIMIZE]
notes0110= Fortran base flags: $[FOPTIMIZE]

#####################################################################
# 32/64 bit Portability Flags - all
#####################################################################

default=base=default=default:
notes25= PORTABILITY=-DSPEC_CPU_LP64 is applied to all benchmarks in base.
PORTABILITY = -DSPEC_CPU_LP64


#####################################################################
# Portability Flags - INT
#####################################################################

400.perlbench=default=default=default:
notes35    = 400.perlbench: -DSPEC_CPU_LINUX
CPORTABILITY= -DSPEC_CPU_LINUX -std=gnu89

401.bzip2=default=default=default:
CPORTABILITY= -Wno-int-conversion

403.gcc=default=default=default:
CPORTABILITY= -Wno-incompatible-pointer-types

445.gobmk=default=default=default:
CPORTABILITY= -fwrapv-pointer

456.hmmer=default=default=default:
CPORTABILITY= -Wno-implicit-function-declaration

462.libquantum=default=default=default:
notes60= 462.libquantum: -DSPEC_CPU_LINUX
CPORTABILITY= -DSPEC_CPU_LINUX

483.xalancbmk=default=default=default:
CXXPORTABILITY= -DSPEC_CPU_LINUX -std=gnu++98 -fdelayed-template-parsing

473.astar=default=default=default:
CXXPORTABILITY= -std=c++98


#####################################################################
# Portability Flags - FP
#####################################################################

416.gamess=default=default=default:
FPORTABILITY   = -std=f2018
srcalt=common

444.namd=default=default=default:
CXXPORTABILITY = -Wno-register

447.dealII=default=default=default:
CXXPORTABILITY = -DSPEC_CPU_LINUX -include cstddef -fpermissive -std=gnu++98

450.soplex=default=default=default:
CXXPORTABILITY = -std=c++03

453.povray=default=default=default:
CXXPORTABILITY = -Wno-register

454.calculix=default=default=default:
CPORTABILITY = -Wno-int-conversion

465.tonto=default=default=default:
#FPPPORTABILITY= -DLANGUAGE_FORTRAN_90

481.wrf=default=default=default:
CPORTABILITY = -DSPEC_CPU_CASE_FLAG -DSPEC_CPU_LINUX -Wno-implicit-int -Wno-implicit-function-declaration
FPORTABILITY = -fno-stack-arrays

445.gobmk=default=default=default:
makeflags = -j 1

436.cactusADM=default=default=default:
makeflags = -j 1
