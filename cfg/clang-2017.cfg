#------------------------------------------------------------------------------
# SPEC CPU2017 config file for: clang / flang on Linux LoongArch
#------------------------------------------------------------------------------
#
# Usage: (1) Copy this to a new name
#             cd $SPEC/config
#             cp Example-x.cfg myname.cfg
#        (2) Change items that are marked 'EDIT' (search for it)
#
# Compiler issues: Contact your compiler vendor, not SPEC.
# For SPEC help:   http://www.spec.org/cpu2017/Docs/techsupport.html
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
# Arbitrary string to tag binaries (no spaces allowed)
%define label clang-loongarch           # EDIT: use a label meaningful to *you*.


#--------- Preprocessor -------------------------------------------------------
%ifndef %{bits}                # EDIT to control 32 or 64 bit compilation.
%   define  bits        64     #      Or, you can set it on the command line:
%endif                         #      'runcpu --define bits=nn'

%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus  8      #      Or, set on command line:
%endif                         #      'runcpu --define build_ncpus=nn'

# Don't change this part.
%define    os           LINUX
%if %{bits} == 64
%   define model        -mabi=lp64d
%elif %{bits} == 32
%   define model        -mabi=ilp32
%else
%   error Please define number of bits - see instructions in config file
%endif
%if %{label} =~ m/ /
%   error Your label "%{label}" contains spaces.  Please try underscores instead.
%endif
%if %{label} !~ m/^[a-zA-Z0-9._-]+$/
%   error Illegal character in label "%{label}".  Please use only alphanumerics, underscore, hyphen, and period.
%endif


#--------- Global Settings ----------------------------------------------------
# For info, see:
#            https://www.spec.org/cpu2017/Docs/config.html#fieldname
#   Example: https://www.spec.org/cpu2017/Docs/config.html#tune

command_add_redirect = 1
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = 1
label                = %{label}-%{bits}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,csv
preenv               = 1
reportable           = 0
tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# Both SPECrate and SPECspeed can test multiple chips / cores / hw threads
#    - For SPECrate,  you set the number of copies.
#    - For SPECspeed, you set the number of threads.
# See: https://www.spec.org/cpu2017/Docs/system-requirements.html#MultipleCPUs

intrate,fprate:
   copies           = 1   # EDIT to change number of copies
intspeed,fpspeed:
   threads          = 8   # EDIT to change number of threads


#------- Compilers ------------------------------------------------------------
default:
#  EDIT: The parent directory for your LLVM build.
#        Do not include the trailing /bin/
%ifndef %{clang_dir}
%   define  clang_dir     @@BUILD_DIR@@  # EDIT (see above)
%endif

# EDIT if needed: the preENV line adds library directories to the runtime path.
   preENV_LD_LIBRARY_PATH  = %{clang_dir}/lib/:%{clang_dir}/lib/loongarch64-unknown-linux-gnu/:/lib64
   SPECLANG                = %{clang_dir}/bin/
   CC                      = $(SPECLANG)clang -std=c99 %{model}
   CXX                     = $(SPECLANG)clang++ -std=c++03 %{model}
   FC                      = $(SPECLANG)flang %{model}
   # How to say "Show me your version, please"
   CC_VERSION_OPTION       = -v
   CXX_VERSION_OPTION      = -v
   FC_VERSION_OPTION       = -v

default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif


#--------- Portability --------------------------------------------------------
default:   # data model applies to all benchmarks
%if %{bits} == 32
    EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
    EXTRA_PORTABILITY = -DSPEC_LP64
%endif

# Benchmark-specific portability (ordered by last 2 digits of bmark number)

500.perlbench_r,600.perlbench_s:  #lang='C'
%if %{bits} == 32
%   define suffix IA32
%else
%   define suffix X64
%endif
   PORTABILITY    = -DSPEC_%{os}_%{suffix} -fno-finite-math-only -fno-unsafe-math-optimizations

511.povray_r:  #lang='CXX'
   PORTABILITY    = -fno-strict-aliasing -fno-finite-math-only

521.wrf_r,621.wrf_s:  #lang='F,C'
   CPORTABILITY  = -DSPEC_CASE_FLAG
   FPORTABILITY  = -fconvert=big-endian

523.xalancbmk_r,623.xalancbmk_s:  #lang='CXX'
   PORTABILITY   = -DSPEC_%{os} -fdelayed-template-parsing

525.x264_r:  #lang='CXX,C'
   PORTABILITY = -fcommon

526.blender_r:  #lang='CXX,C'
   EXTRA_CXXFLAGS = -std=c++17
   PORTABILITY   = -funsigned-char -DSPEC_LINUX -Wno-stringop-overread

527.cam4_r,627.cam4_s:  #lang='F,C'
   PORTABILITY   = -DSPEC_CASE_FLAG
   CPORTABILITY  = -Wno-implicit-int

549.fotonik3d_r:  #lang='F'
   CPORTABILITY = -fno-unsafe-math-optimizations -fcommon

625.x264_s:  #lang='CXX,C'
   PORTABILITY = -fcommon

628.pop2_s:  #lang='F,C'
   CPORTABILITY = -DSPEC_CASE_FLAG
   FPORTABILITY = -fconvert=big-endian


#-------- Tuning Flags common to Base and Peak --------------------------------
#
# Speed (OpenMP and Autopar allowed)
#
%if %{bits} == 32
   intspeed,fpspeed:
      fail_build = 1
%else
   intspeed,fpspeed:
      EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP
   fpspeed:
      preENV_OMP_STACKSIZE = 120M
%endif


#--------  Baseline Tuning Flags ----------------------------------------------
#
default=base:         # flags for all base
   OPTIMIZE       = -mabi=lp64d -march=loongarch64 -O3 -mlsx

intrate,intspeed=base: # flags for integer base
   EXTRA_COPTIMIZE   = -fno-strict-aliasing -fgnu89-inline
   EXTRA_CXXOPTIMIZE = -ffinite-loops
   EXTRA_FOPTIMIZE   = -fstack-arrays
# Notes about the above
#  - 500.perlbench_r/600.perlbench_s needs -fno-strict-aliasing.
#  - 502.gcc_r/602.gcc_s             needs -fgnu89-inline or -z muldefs
#  - For 'base', all benchmarks in a set must use the same options.


#--------  Peak Tuning Flags ----------------------------------------------
default=peak:
   basepeak = yes  # if you develop some peak tuning, remove this line.


#------------------------------------------------------------------------------
# Tester and System Descriptions - EDIT all sections below this point
#-------------------------------------------------------------------------------
#   For info about any field, see
#             https://www.spec.org/cpu2017/Docs/config.html#fieldname
#-------------------------------------------------------------------------------

#--------- EDIT to match your version -----------------------------------------
default:
   sw_compiler001   = C/C++: clang (LLVM main)
   sw_compiler002   = Fortran: flang (LLVM main)

#--------- EDIT info about you ------------------------------------------------
intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_vendor          = Loongson
   tester             = Loongson
   test_sponsor       = Loongson
   license_num        = nnn (Your SPEC license number)

#--------- EDIT system availability dates -------------------------------------
intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_avail           = # Nov-2099
   sw_avail           = # Nov-2099

#--------- EDIT system information --------------------------------------------
intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_cpu_name        = # Loongson XXX
   hw_cpu_nominal_mhz = # 9999
   hw_cpu_max_mhz     = # 9999
   hw_model           = # system model
   hw_ncores          = # 9999
   hw_nthreadspercore = # 9
   hw_pcache          = # 99 KB I + 99 KB D on chip per core
   hw_scache          = # 99 KB I+D on chip per 9 cores
   hw_tcache          = # 9 MB I+D on chip per chip
   hw_memory          = # 999 GB
   sw_os              = # Linux Distribution
   sw_other           = # Other perf-relevant sw, or "None"
