# SPEC CPU 2017 Configuration: clang O2 baseline on LoongArch

define[LLVM_INSTALL] = @@BUILD_DIR@@/install

define[CC] = ${LLVM_INSTALL}/bin/clang
define[CXX] = ${LLVM_INSTALL}/bin/clang++
define[FC] = ${LLVM_INSTALL}/bin/flang

define[OPT_CXX] = -O2 -march=loongarch64 -std=c++14
define[OPT_C] = -O2 -march=loongarch64
define[OPT_F] = -O2 -march=loongarch64

define[BASE_FLAGS_CXX] = ${OPT_CXX}
define[BASE_FLAGS_C] = ${OPT_C}
define[BASE_FLAGS_F] = ${OPT_F}

define[PEAK_FLAGS_CXX] = ${OPT_CXX}
define[PEAK_FLAGS_C] = ${OPT_C}
define[PEAK_FLAGS_F] = ${OPT_F}

define[LD] = ${LLVM_INSTALL}/bin/clang
define[LD_F] = ${LLVM_INSTALL}/bin/flang
define[LINK_FLAGS] = -Wl,--strip-all
define[LINK_FLAGS_F] = -Wl,--strip-all

set[build:link line] = ${LINK_FLAGS}
set[build:link line f] = ${LINK_FLAGS_F}

set[reportable_output_format] = html
set[run:cmdline output limit] = 2000000
set[run:maxrunbytes] = 2000000