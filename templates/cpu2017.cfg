#------------------------------------------------------------------------------
# SPEC CPU2017 config file for: clang/clang++/flang on LoongArch Linux
#------------------------------------------------------------------------------
# This template is filled in by spec-ci generator.py:
#   @LLVM_DIR@     -> LLVM build directory
#   @ITERATIONS@   -> number of runs from YAML
#   @COPTIMIZE@  @CXXOPTIMIZE@  @FOPTIMIZE@  -> optimization flags from YAML
# Per-benchmark portability blocks are appended from spec-ci.yaml by generator.py.
#------------------------------------------------------------------------------

%define label clang-ci

%ifndef %{bits}
%   define  bits        64
%endif

%ifndef %{build_ncpus}
%   define  build_ncpus 32
%endif

%define    os           LINUX
%if %{bits} == 64
%   define model        -mabi=lp64d
%elif %{bits} == 32
%   define model        -mabi=lp32
%else
%   error Please define number of bits - see instructions in config file
%endif
%if %{label} =~ m/ /
%   error Your label "%{label}" contains spaces.  Please try underscores instead.
%endif
%if %{label} !~ m/^[a-zA-Z0-9._-]+$/
%   error Illegal character in label "%{label}".  Please use only alphanumerics, underscore, hyphen, and period.
%endif

#--------- Global Settings ----------------------------------------------------
command_add_redirect = 1
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = @ITERATIONS@
label                = %{label}-m%{bits}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,cfg,pdf,csv
preenv               = 1
reportable           = 0
tune                 = base

#--------- How Many CPUs? -----------------------------------------------------
intrate,fprate:
   copies           = 1
intspeed,fpspeed:
   threads          = 4

#------- Compilers ------------------------------------------------------------
default:
   preENV_LD_LIBRARY_PATH  = @LLVM_DIR@/lib/:@LLVM_DIR@/lib/loongarch64-unknown-linux-gnu/
   SPECLANG                = @LLVM_DIR@/bin/
   CC                      = $(SPECLANG)clang     -std=c99   %{model}
   CXX                     = $(SPECLANG)clang++     -std=c++03 %{model}
   FC                      = $(SPECLANG)flang           %{model}
   CC_VERSION_OPTION       = -v
   CXX_VERSION_OPTION      = -v
   FC_VERSION_OPTION       = -v

default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif

#--------- Portability --------------------------------------------------------
default:
%if %{bits} == 32
    EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
    EXTRA_PORTABILITY = -DSPEC_LP64
%endif

#-------- Tuning Flags common to Base and Peak --------------------------------
%if %{bits} == 32
   intspeed,fpspeed:
   fail_build = 1
%else
   intspeed,fpspeed:
      EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP
   fpspeed:
      preENV_OMP_STACKSIZE = 120M
%endif

#--------  Baseline Tuning Flags ----------------------------------------------
default=base:
   COPTIMIZE    = @COPTIMIZE@
   CXXOPTIMIZE  = @CXXOPTIMIZE@
   FOPTIMIZE    = @FOPTIMIZE@
intrate,intspeed=base:
   EXTRA_COPTIMIZE      =  -fno-strict-aliasing -fgnu89-inline
   EXTRA_CXXOPTIMIZE    =  -ffinite-loops
   EXTRA_FOPTIMIZE      =  -fstack-arrays

default=base=O1:
   OPTIMIZE       = -O1 -fno-unsafe-math-optimizations  -fno-tree-loop-vectorize

default=base=O2:
   OPTIMIZE       = -O2 -fno-unsafe-math-optimizations  -fno-tree-loop-vectorize

default=base=O3:
   OPTIMIZE       = -O3 -fno-unsafe-math-optimizations  -fno-tree-loop-vectorize

default=base=Os:
   OPTIMIZE       = -Os -fno-unsafe-math-optimizations  -fno-tree-loop-vectorize

#--------  Peak Tuning Flags ----------------------------------------------
default=peak:
   basepeak = yes

#------------------------------------------------------------------------------
# Tester and System Descriptions
#------------------------------------------------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: clang/clang++/flang
   sw_compiler002   = LLVM/Clang compiler collection

intrate,intspeed,fprate,fpspeed:
   license_num        = 49
