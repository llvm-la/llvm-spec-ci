# CPU2006 config file for CPU2006 Base (generated by spec-ci generator.py)
ignore_errors = yes
tune          = base
ext           = la
output_format = asc, pdf, Screen, csv
reportable    = 0
teeout        = yes
teerunout     = yes
license_num = 49
makeflags = -j 8

default=default=default=default:
#####################################################################
# Compiler selection
#####################################################################
CC           = @LLVM_DIR@/bin/clang
CXX          = @LLVM_DIR@/bin/clang++
FC           = @LLVM_DIR@/bin/flang
sw_compiler  = clang, clang++ & flang
strict_rundir_verify=0

#####################################################################
# Optimization
#####################################################################
default=peak=default=default:

default=base=default=default:
COPTIMIZE    = @COPTIMIZE@
CXXOPTIMIZE  = @CXXOPTIMIZE@
FOPTIMIZE    = @FOPTIMIZE@

notes0100= C/C++ base flags: $[COPTIMIZE]
notes0110= Fortran base flags: $[FOPTIMIZE]

#####################################################################
# Portability Flags - all
#####################################################################
default=base=default=default:
PORTABILITY = -DSPEC_CPU_LP64
